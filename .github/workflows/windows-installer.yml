name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Select release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '0.1.0-dev'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish src/Screenwriter.App/Screenwriter.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:APP_VERSION
      - name: Build per-user installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/O$env:GITHUB_WORKSPACE\artifacts\windows" "/DAppVersion=$env:APP_VERSION" "/DPublishDir=$env:GITHUB_WORKSPACE\src\Screenwriter.App\bin\Release\net10.0\win-x64\publish" packaging/windows/Draftroom.iss
      - name: Write installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/windows/Draftroom-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content artifacts/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: draftroom-windows-x64
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
